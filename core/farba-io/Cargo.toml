[package]
name = "farba-io"
description = "Native file formats of Farba: OpenRaster, PDF and the Windows codecs (HEIF, AVIF)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
farba-core.workspace = true
farba-text = { path = "../farba-text" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-writer = "0.15"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
ravif = "0.13"
avif-decode = { version = "3", default-features = false }
resvg = "0.48.1"

[target.'cfg(windows)'.dependencies]
# Windows.Data.Pdf renders PDF pages and WIC reads / writes HEIF and AVIF with the codecs
# installed in Windows (nothing to ship).
windows = { version = "0.62.2", features = [
  "Data_Pdf",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "UI",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[target.'cfg(not(windows))'.dependencies]
# PDF import outside Windows: PDFium (BSD-3 / Apache-2.0), loaded at run time from
# libpdfium.so shipped next to the app (bblanchon/pdfium-binaries, chromium/7881).
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
