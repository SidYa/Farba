[package]
workspace = "../../core"
name = "farba"
description = "Farba image editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "farba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
farba-core.workspace = true
farba-text = { path = "../../core/farba-text" }
farba-io = { path = "../../core/farba-io" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-dialog = "2.8.2"
arboard = "3.6.1"
libloading = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Same versions as wry/tauri use; needed for WebView2 SharedBuffer (zero-copy pixel transfer).
webview2-com = "0.39.1"
windows = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust acosf / atan2f in place of glibc's (see glibc_compat.rs).
libm = "0.2"
