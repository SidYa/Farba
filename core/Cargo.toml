# The Cargo workspace of Farba. All Rust crates live in this folder, except the Tauri app
# crate (`../app/src-tauri`), which joins the workspace through `package.workspace`.
[workspace]
resolver = "3"
members = ["farba-core", "farba-wasm", "farba-text", "farba-io", "farba-ai", "farba-heif", "../app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Sergii Sidko"]

[workspace.dependencies]
farba-core = { path = "farba-core" }

[profile.dev]
# Pixel loops are unusably slow without optimisation; keep debug info but optimise deps.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
