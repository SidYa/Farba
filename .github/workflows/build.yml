# Builds the Linux (.deb, .rpm) and macOS (.dmg, Apple Silicon and Intel) packages on
# GitHub's machines. Run it by hand (Actions > Build > Run workflow): the packages are the
# run's artifacts. On a version tag (v1.1.0...) they are also attached to a draft release of
# that tag. The Windows installer is built locally (`pnpm installer`).
#
# Linux is built on Ubuntu 22.04 on purpose: its glibc 2.35 is the newest the binary may
# need (app/build-linux.sh checks it), so it runs on Ubuntu 22.04+, Debian 12, Fedora...
# macOS builds are not signed: the first start needs right click > Open.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (.deb, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          # nasm: the x86 assembly of rav1d (the AVIF decoder).
          sudo apt-get update
          sudo apt-get install -y build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build
        run: bash app/build-linux.sh --app

      - uses: actions/upload-artifact@v4
        with:
          name: farba-linux
          path: |
            core/target/release/bundle/deb/*.deb
            core/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            core/target/release/bundle/deb/*.deb
            core/target/release/bundle/rpm/*.rpm

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    # Apple Silicon; the Intel build is cross-compiled. "latest": GitHub retires old macOS
    # images (macos-14 went away).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      # gen-licenses.mjs lists the crates of the target being built.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # PDFium (PDF import), prebuilt by bblanchon/pdfium-binaries: the version of the
      # pdfium-render feature in core/farba-io/Cargo.toml (same as app/build-linux.sh).
      PDFIUM_VERSION: "7881"
    steps:
      - uses: actions/checkout@v4

      # The x86 assembly of rav1d (the AVIF decoder) for the Intel build.
      - name: NASM
        if: matrix.arch == 'x64'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: PDFium
        run: |
          mkdir -p core/target/pdfium
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/$PDFIUM_VERSION/pdfium-mac-${{ matrix.arch }}.tgz" \
            | tar xz -C core/target/pdfium

      - name: Build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          # beforeBuildCommand builds the WASM module (wasm-pack passes its own --target)
          # and the UI.
          pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: farba-macos-${{ matrix.arch }}
          path: core/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: core/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
